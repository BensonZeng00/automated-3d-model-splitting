name: Approved Panda 3MF regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/automated-3d-model-splitting/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r skills/automated-3d-model-splitting/requirements.txt
      - name: Rebuild and compare all 15 approved parts
        env:
          RUN_PANDA_GOLDEN: "1"
          PYTHONUTF8: "1"
        run: python -X utf8 -B -m unittest discover -s skills/automated-3d-model-splitting/tests -p test_panda_golden.py -v
