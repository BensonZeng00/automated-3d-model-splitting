name: Windows and macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/automated-3d-model-splitting/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/automated-3d-model-splitting/requirements.txt
          python -m pip check

      - name: Repository release guard tests
        run: python -X utf8 -B -m unittest discover -s tools/tests -v

      - name: Unit and regression tests
        working-directory: skills/automated-3d-model-splitting
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Release consistency checks
        run: python -X utf8 -B tools/validate_release.py

      - name: Synthetic end-to-end test
        run: python -X utf8 -B tools/run_synthetic_e2e.py
